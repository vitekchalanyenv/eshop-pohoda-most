[project]
name = "eshop-pohoda-most"
version = "0.1.0"
description = "Integrační most mezi e-shopem a účetním systémem Pohoda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/most"]

[tool.pytest.ini_options]
testpaths = ["tests"]
